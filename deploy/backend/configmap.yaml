apiVersion: v1
kind: ConfigMap
metadata:
  name: nodi-backend-config
  namespace: nodi
data:
  PUBLIC_BASE_URL: "https://nodi.example.com"
  CORS_ORIGINS: "https://nodi.example.com"

  ATTACHMENT_STORAGE: "minio"
  # Existing MinIO endpoint. Do not include https:// in this value.
  MINIO_ENDPOINT: "api-minio.ldy-studio.com"
  MINIO_PORT: "443"
  MINIO_BUCKET: "nodi"
  MINIO_USE_SSL: "true"

  # No trusted proxy CIDR is required while the backend IP rate limiter is off.
  RATE_LIMIT_ENABLED: "false"
