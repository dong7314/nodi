apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodi-backend
  namespace: nodi
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nodi.example.com
      secretName: nodi-tls
  rules:
    - host: nodi.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: nodi-backend
                port:
                  name: http
