# Example only. Copy this file to secret.yaml and replace every placeholder.
# deploy/backend/secret.yaml is ignored by Git.
apiVersion: v1
kind: Secret
metadata:
  name: nodi-backend-secret
  namespace: nodi
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/nodi"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME"
  # Use a restricted application account created in the existing MinIO.
  MINIO_ACCESS_KEY: "nodi-api"
  MINIO_SECRET_KEY: "CHANGE_ME"
