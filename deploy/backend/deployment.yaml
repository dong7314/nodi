apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodi-backend
  namespace: nodi
spec:
  # Realtime rooms are kept in process memory. Keep one replica until the
  # realtime hub uses a shared Redis/NATS pub/sub transport.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodi-backend
      app.kubernetes.io/part-of: nodi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodi-backend
        app.kubernetes.io/part-of: nodi
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: harbor.ldy-studio.com/nodi/backend:test
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: nodi-backend-config
            - secretRef:
                name: nodi-backend-secret
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
