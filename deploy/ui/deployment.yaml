apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodi-ui
  namespace: nodi
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nodi-ui
      app.kubernetes.io/part-of: nodi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodi-ui
        app.kubernetes.io/part-of: nodi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: harbor.ldy-studio.com/nodi/frontend:test
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: nodi-ui-config
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
