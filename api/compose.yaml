services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodi
      POSTGRES_USER: nodi
      POSTGRES_PASSWORD: nodi
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodi -d nodi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 512m
    cpus: 1.5

  api:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nodi:nodi@postgres:5432/nodi?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8787
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /data/uploads
      DB_MAX_CONNS: 8
      DB_MIN_CONNS: 1
      MAX_IN_FLIGHT: 128
      AUTO_MIGRATE: "true"
    ports:
      - "8787:8787"
    volumes:
      - attachment_data:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0

volumes:
  postgres_data:
  attachment_data:
